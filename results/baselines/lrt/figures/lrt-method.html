<div id="lrt-method-explainer">
  <div class="viz-controls">
    <label class="form-label">展开查看
      <select class="form-select" data-view aria-label="选择方法结构图">
        <option value="flow">当前方法：一轮测试怎样运行</option>
        <option value="value">动作价值网络：下一步测哪个场景</option>
        <option value="remaining">续期发现预测网络：还需不需要继续</option>
        <option value="learning">拟议改进：目标反馈校正与持续学习</option>
      </select>
    </label>
  </div>
  <svg class="lrt-flow" role="img" aria-label="当前方法一轮测试的流程图"></svg>
  <div class="sr-only">同一套测试方法维护三套风险后验，表示强、中、弱历史迁移假设。三套后验共同参与一次场景选择，每轮只有一个真实场景执行入口，一份风险反馈同时更新三套后验和参照组件。</div>
</div>
<style>
  #lrt-method-explainer .lrt-flow { display:block; width:100%; overflow:visible; }
  #lrt-method-explainer .lrt-flow text { font-family:inherit; fill:var(--foreground); font-weight:400; }
  #lrt-method-explainer .lrt-flow .node-title { font-weight:500; }
  #lrt-method-explainer .lrt-flow .edge-label { fill:var(--muted-foreground); }
</style>
<script>
(() => {
  const root = document.getElementById('lrt-method-explainer');
  const svg = root.querySelector('.lrt-flow');
  const control = root.querySelector('[data-view]');
  const ns = 'http://www.w3.org/2000/svg';
  const valid = ['flow', 'value', 'remaining', 'learning'];
  let view = 'flow';
  let width = 0;
  function element(name, attributes, parent = svg) {
    const item = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attributes || {})) item.setAttribute(key, value);
    parent.appendChild(item);
    return item;
  }
  function text(value, x, y, kind = '', parent = svg) {
    const item = element('text', {x, y, 'text-anchor':'middle', class:kind}, parent);
    item.textContent = value;
    return item;
  }
  function wrap(value, available) {
    const unit = parseFloat(getComputedStyle(root).fontSize) || 14;
    const limit = Math.max(6, available / unit);
    const rows = [];
    let row = '', used = 0;
    for (const ch of value) {
      const size = ch.charCodeAt(0) < 128 ? 0.58 : 1;
      if (used + size > limit && row) { rows.push(row); row = ''; used = 0; }
      row += ch; used += size;
    }
    if (row) rows.push(row);
    return rows;
  }
  function box(x, y, w, title, subtitle = '', role = 'normal') {
    const titles = wrap(title, w - 24);
    const subs = subtitle ? wrap(subtitle, w - 24) : [];
    const line = Math.max(23, (parseFloat(getComputedStyle(root).fontSize) || 14) * 1.65);
    const h = 24 + line * (titles.length + subs.length);
    const g = element('g', {'data-node':title});
    const fill = role === 'execute' ? 'color-mix(in srgb, var(--viz-series-2) 16%, var(--background))' : role === 'network' ? 'color-mix(in srgb, var(--viz-series-1) 10%, var(--background))' : 'var(--background)';
    element('rect', {x, y, width:w, height:h, rx:5, fill, stroke:'var(--border)', 'stroke-width':1}, g);
    titles.forEach((s,i) => text(s, x+w/2, y+24+i*line, 'node-title', g));
    subs.forEach((s,i) => text(s, x+w/2, y+24+(i+titles.length)*line, '', g));
    return {x,y,w,h,cx:x+w/2,cy:y+h/2,bottom:y+h,right:x+w};
  }
  function line(points, arrow = true) {
    return element('path', {
      d:points.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' '),
      fill:'none',stroke:'var(--muted-foreground)','stroke-width':1.3,
      ...(arrow ? {'marker-end':'url(#lrt-method-arrow)'} : {})
    });
  }
  function down(a,b) { line([[a.cx,a.bottom],[a.cx,(a.bottom+b.y)/2],[b.cx,(a.bottom+b.y)/2],[b.cx,b.y-4]]); }
  function begin(title, description) {
    svg.replaceChildren();
    element('title').textContent = title;
    element('desc').textContent = description;
    svg.setAttribute('aria-label', title);
    const defs = element('defs');
    const marker = element('marker',{id:'lrt-method-arrow',viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);
    element('path',{d:'M 0 0 L 8 4 L 0 8 Z',fill:'var(--muted-foreground)'},marker);
    text(title,width/2,24,'node-title');
  }
  function finish(height) {
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.setAttribute('height',height);
  }
  function flow() {
    begin('已实现：同一方法，每轮执行一个场景','三种历史迁移假设分别计算风险。共享停止网络判断是否继续，共享动作价值网络和替换约束选择一个场景，实际反馈回到三套后验。');
    const margin=28, full=width-margin*2;
    const input=box(margin,48,full,'历史记录＋已测试风险','未测场景参数与剩余预算');
    let hypotheses=[];
    if(width>=580){
      const w=(full-24)/3, y=input.bottom+52;
      ['较强历史迁移','名义模型','较弱历史迁移'].forEach((name,i)=>{
        const n=box(margin+i*(w+12),y,w,name,'风险后验');
        line([[input.cx,input.bottom],[input.cx,y-25],[n.cx,y-25],[n.cx,y-4]]);
        hypotheses.push(n);
      });
    }else{
      let y=input.bottom+44;
      ['较强历史迁移','名义模型','较弱历史迁移'].forEach(name=>{
        const n=box(margin+20,y,full-20,name,'风险后验');
        line([[input.cx,input.bottom],[margin+8,input.bottom+19],[margin+8,n.cy],[n.x-4,n.cy]]);
        hypotheses.push(n);y=n.bottom+12;
      });
    }
    const bottom=Math.max(...hypotheses.map(n=>n.bottom));
    const stop=box(margin,bottom+62,full,'续期发现预测网络','同一组网络参数，分别读取三套后验','network');
    if(width>=580){
      hypotheses.forEach(n=>line([[n.cx,n.bottom],[n.cx,bottom+26],[stop.cx,bottom+26],[stop.cx,stop.y-4]]));
    }else{
      hypotheses.forEach(n=>line([[n.right,n.cy],[width-14,n.cy],[width-14,bottom+25],[stop.cx,bottom+25],[stop.cx,stop.y-4]]));
    }
    const selectW=full*0.64, gap=16;
    const choose=box(margin,stop.bottom+72,selectW,'下一待测场景选择','动作价值网络＋替换损失约束','network');
    const end=box(margin+selectW+gap,choose.y,full-selectW-gap,'结束任务');
    const junction=stop.bottom+30;
    line([[stop.cx,stop.bottom],[stop.cx,junction],[choose.cx,junction],[choose.cx,choose.y-4]]);
    line([[stop.cx,junction],[end.cx,junction],[end.cx,end.y-4]]);
    text('继续',choose.cx,choose.y-15,'edge-label');
    text('停止',end.cx,end.y-15,'edge-label');
    const execute=box(margin,Math.max(choose.bottom,end.bottom)+44,full,'被测驾驶控制器执行一个场景','实际测试次数 +1；获得一个风险值 R','execute');
    line([[choose.cx,choose.bottom],[choose.cx,execute.y-22],[execute.cx,execute.y-22],[execute.cx,execute.y-4]]);
    line([[execute.cx,execute.bottom],[execute.cx,execute.bottom+25],[12,execute.bottom+25],[12,input.cy],[input.x-4,input.cy]]);
    const labels=wrap('同一个风险值更新三套后验与参照组件',width-50);
    labels.forEach((s,i)=>text(s,width/2,execute.bottom+53+i*23,'edge-label'));
    finish(execute.bottom+70+labels.length*23);
  }
  function chain(title,description,rows,training){
    begin(title,description);
    const margin=28,w=width-56;
    let y=52,prior=null;
    rows.forEach(row=>{
      const n=box(margin,y,w,row[0],row[1],row[2]||'normal');
      if(prior)down(prior,n);
      prior=n;y=n.bottom+35;
    });
    if(training){
      const label=wrap(training,width-56);
      label.forEach((s,i)=>text(s,width/2,y+5+23*i,'edge-label'));
      y+=label.length*23+15;
    }
    finish(y+5);
  }
  function draw(){
    width=Math.max(280,root.getBoundingClientRect().width);
    if(view==='flow')flow();
    if(view==='value')chain('已实现：动作价值网络','来源信息经共享多层感知机汇总，再编码候选与候选集合，输出选择该候选后的预计累计发现数。',[
      ['输入：候选场景与风险后验','来源均值、标准差、权重、目标分量标记'],
      ['来源编码：4 → 32 → 32','按来源权重汇总','network'],
      ['候选编码：39 → 64 → 64','加入场景参数、名义风险概率和参照概率','network'],
      ['集合汇总＋预算与前瞻信息','全部未测场景、预算内高风险集合、边界候选'],
      ['收益预测头：264 → 64 → 64 → 1','每个候选、每套风险假设各得到一个预测','network'],
      ['输出：预计累计危险场景发现数','先测该候选，后续按参照策略运行']
    ],'训练标签：历史真实风险上的参照策略分支回放');
    if(view==='remaining')chain('已实现：续期发现预测网络','复制并冻结动作价值网络的来源和候选编码器，用新预测头输出续期计数分布。',[
      ['输入：当前已测历史与剩余候选','已发现数量、预算与风险后验'],
      ['复用并冻结来源编码与候选编码','与动作价值网络相同的编码结构','network'],
      ['集合汇总＋测试进度','全部未测场景、前 b 个高风险候选、近期误差'],
      ['分布预测头：136 → 64 → 64 → 3','3 个输出是分布参数','network'],
      ['输出：新增 0、1、…、b 个发现的概率','零膨胀贝塔二项计数分布'],
      ['检查发现质量保留条件','继续测试，或结束当前任务']
    ],'训练标签：固定 LRT 历史轨迹中的后续实际发现数');
    if(view==='learning')chain('拟议改进：在线校正与周期更新','尚未实现。当前任务利用已完成片段校正预测，多个任务结束后用新旧记录更新共享网络。',[
      ['当前任务：已完成的真实测试片段','得到实际新增发现数'],
      ['低维收益校正层','修正当前控制器上的预测偏差与不确定性','network'],
      ['依据校正后的收益决定继续或停止','设计目标：保留至少 95% 的固定预算发现质量'],
      ['任务结束：保存已完成片段','未执行的后续部分保持未知'],
      ['新旧记录混合，周期更新共享预测头','使用完整测试记录校准长期收益','network'],
      ['更新后的模型用于后续测试任务','车辆切入与前车紧急制动分别学习']
    ]);
  }
  function restore(state){
    const next=state?.modelContent?.view;
    if(valid.includes(next)){view=next;control.value=view;draw();}
  }
  control.addEventListener('change',()=>{
    view=control.value;draw();
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view},privateContent:null}).catch(()=>{});
  });
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  new ResizeObserver(()=>draw()).observe(root);
  if(window.openai?.widgetState)restore(window.openai.widgetState);
  draw();
})();
</script>
