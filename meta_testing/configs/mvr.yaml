schema: hierarchical_map_aware_mvr_v1
seed: 11
taskbook: meta_testing/configs/idm_taskbook.json
model:
  state_dim: 10
training:
  device: cuda
  family_filter: all
  step_budget: 240
  learning_rate: 0.0003
evaluation:
  total_episode_budget: 20
  support_shots: [0, 1, 2, 4]
  seeds: [11, 22, 33]
  deterministic: false
failure:
  severity_thresholds: {ttc_s: 5.0, distance_m: 10.0, closing_speed_mps: 20.0}
  severity_bins: 5
inner:
  algorithm: option_conditioned_sac
  action_dim: 2
  batch_size: 64
  episode_budget: 20
  updates_per_episode: 8
  replay_capacity: 100000
  learning_rate: 0.0003
inner_latent_calibration:
  simulator_episode_budget: 16
  support_episodes: 1
  updates_per_episode: 8
  replay_capacity: 100000
  batch_size: 64
  learning_rate: 0.0003
posterior:
  episode_budget: 20
  support_episodes: [1, 2, 4]
  learning_rate: 0.0003
outer:
  algorithm: hybrid_ppo
  ppo_epochs: 4
  batch_size: 64
  episodes_per_task: 20
  learning_rate: 0.0003
map:
  encoder: hptr_style_v1
  polyline_points: 16
  embedding_dim: 128
  cache_embeddings_only_when_frozen: true
sut_profiles:
  meta_train: [idm_cautious, idm_defensive, idm_normal, idm_assertive]
  validation: [idm_fast_small_gap]
  meta_test: [idm_late_response]
