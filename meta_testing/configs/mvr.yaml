schema: hierarchical_map_aware_mvr_v1
seed: 11
evaluation:
  total_episode_budget: 20
  support_shots: [0, 1, 2, 4]
  seeds: [11, 22, 33]
  confidence_level: 0.95
  bootstrap_samples: 10000
failure:
  severity_thresholds: {ttc_s: 5.0, distance_m: 10.0, closing_speed_mps: 20.0}
  severity_bins: 5
outer:
  algorithm: hybrid_ppo
  information_gain_weight: 0.0
inner:
  algorithm: option_conditioned_sac
  action_dim: 2
map:
  encoder: hptr_style_v1
  polyline_points: 16
  embedding_dim: 128
  cache_embeddings_only_when_frozen: true
sut_profiles:
  meta_train: [idm_cautious, idm_assertive, rule_yield, rule_gap_accept]
  validation: [rule_reactive_brake]
  meta_test: [rule_priority]
