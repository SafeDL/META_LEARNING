schema: transferable_scenario_miner
seed: 11
taskbook: mvr/configs/taskbook.json
model:
  state_dim: 30
  latent_dim: 16
  num_experts: 4
context:
  type: pearl_product
  kl_weight: 0.001
  support_shots: [1, 2, 4]
training:
  device: cuda
  family_filter: cutin
  step_budget: 240
  learning_rate: 0.0003
failure:
  severity_thresholds: {ttc_s: 5.0, distance_m: 10.0, closing_speed_mps: 20.0}
  severity_bins: 5
interaction_prior:
  algorithm: adversarial_sac
  action_dim: 4
  batch_size: 64
  episodes_per_task: 40
  updates_per_episode: 12
  replay_capacity: 100000
  learning_rate: 0.0001
  warmup_episodes: 5
  event_sample_fraction: 0.5
  event_action_weight: 0.5
  gamma: 0.99
context_meta:
  support_shots: [1, 2, 4]
  groups_per_task: 3
  queries_per_group: 1
  updates_per_episode: 12
  replay_capacity: 100000
  batch_size: 64
  learning_rate: 0.0003
  event_sample_fraction: 0.5
  event_action_weight: 0.5
  gamma: 0.99
control:
  action_schema: frenet_path_longitudinal_v1
  nominal_controller_schema: stanley_feedforward_v1
  scenario_contract_schema: scenario_contract
map:
  encoder: hptr_style
  polyline_points: 16
  embedding_dim: 128
  cache_embeddings_only_when_frozen: true
outer:
  algorithm: hybrid_moe_ppo
  router_balance_weight: 0.01
  ppo_epochs: 4
  batch_size: 64
  episodes_per_task: 20
  learning_rate: 0.0003
cutin_inner:
  allow_outer: false
  freeze_static_representation_during_interaction_prior: true
  training_sut_refs: [idm_normal]
  training_geometry_ids: [cutin-g01]
  training_logical_domains:
    - id: close_closing_early
      bounds:
        cutin_gap_at_start_m: [-0.75, -0.35]
        sut_initial_speed_mps: [-0.30, 0.30]
        relative_speed_mps: [-0.25, 0.25]
        cutin_start_progress: [-0.65, -0.25]
        cutin_start_time_s: [-0.65, -0.25]
    - id: balanced_interaction
      bounds:
        cutin_gap_at_start_m: [-0.30, 0.30]
        sut_initial_speed_mps: [-0.30, 0.30]
        relative_speed_mps: [-0.40, 0.10]
        cutin_start_progress: [-0.30, 0.30]
        cutin_start_time_s: [-0.30, 0.30]
    - id: late_tight_cutin
      bounds:
        cutin_gap_at_start_m: [0.35, 0.75]
        sut_initial_speed_mps: [-0.30, 0.30]
        relative_speed_mps: [-0.80, -0.40]
        # Late within the executable corridor, while leaving enough route
        # for a full SUT-completion test at the declared step budget.
        cutin_start_progress: [0.15, 0.28]
        cutin_start_time_s: [0.25, 0.65]
evaluation:
  support_shots: [0, 1, 2, 4]
  query_cases: 8
  seeds: [11, 22, 33]
  paired_bootstrap_samples: 10000
  paired_bootstrap_seed: 11
  query_design:
    sobol_interior_per_candidate: 24
    boundary_per_candidate: 8
  failure_rate:
    query_cases: 8
    support_shots: 4
    seeds: [11, 22, 33]
