schema: transferable_scenario_miner
seed: 11
taskbook: mvr/configs/taskbook.json
model:
  state_dim: 11
  latent_dim: 16
  num_experts: 4
context:
  type: pearl_product
  kl_weight: 0.001
  support_shots: [1, 2, 4]
training:
  device: cpu
  family_filter: all
  step_budget: 240
  learning_rate: 0.0003
failure:
  severity_thresholds: {ttc_s: 5.0, distance_m: 10.0, closing_speed_mps: 20.0}
  severity_bins: 5
inner:
  algorithm: adversarial_sac
  action_dim: 2
  sampling: balanced_interaction_aligned
  episodes_per_task: 2
  updates_per_episode: 2
  batch_size: 32
  replay_capacity: 100000
  learning_rate: 0.0003
  gradient_clip_norm: 5.0
  event_sample_fraction: 0.25
  event_action_weight: 0.0
control:
  action_schema: vehicle_residual_2d
  nominal_controller_schema: metadrive_lane_stable_idm
  scenario_contract_schema: scenario_contract
inner_latent_calibration:
  simulator_episode_budget: 4
  support_episodes: 1
  updates_per_episode: 1
  replay_capacity: 100000
  batch_size: 32
  learning_rate: 0.0003
posterior:
  episode_budget: 4
  support_episodes: [1]
  learning_rate: 0.0003
outer:
  algorithm: hybrid_moe_ppo
  router_balance_weight: 0.01
  ppo_epochs: 1
  batch_size: 32
  episodes_per_task: 1
  learning_rate: 0.0003
map:
  encoder: hptr_style
  polyline_points: 16
  embedding_dim: 128
  cache_embeddings_only_when_frozen: true
evaluation:
  total_episode_budget: 4
  support_shots: [0, 1]
  seeds: [11]
  deterministic: true
  regimes: [R1_seen_sut_seen_geometry, R2_unseen_sut_seen_geometry, R3_seen_sut_unseen_geometry, R4_unseen_sut_unseen_geometry]
visualization:
  cases_per_task: 1
  policies: [base, trained_inner]
  topdown:
    screen_size: [800, 800]
    scaling: 5
    frame_stride: 1
    fps: 20
  tail_camera:
    height: 3.2
    distance: 8.0
    pitch: 12.0
preflight:
  # Keep the default run diagnostic and bounded. Add p1/p5/p6/nuisance/profile
  # after Merge/Roundabout x0 calibration has passed the reachability gate.
  phases: [contracts, reward, reachability, p1, p4]
  reward_objective: threshold_proximity
  reachability_report: results/mvr/diagnostics/preflight_reachability.json
  p1_task_ids:
    - merge-g01-normal
    - merge-g01-assertive
    - cutin-g01-normal
    - cutin-g01-assertive
    - roundabout-g01-normal
    - roundabout-g01-assertive
  p4_task_ids:
    - merge-g01-normal
    - cutin-g01-normal
    - roundabout-g01-normal
  p4:
    episodes_per_task: 2
    updates_per_episode: 2
    batch_size: 32
    event_sample_fraction: 0.25
    event_action_weight: 0.0
  p5_task_ids:
    - merge-g01-normal
    - merge-g01-assertive
    - cutin-g01-normal
    - cutin-g01-assertive
    - roundabout-g01-normal
    - roundabout-g01-assertive
  p5:
    episodes_per_task: 3
    updates_per_episode: 4
    batch_size: 32
    event_sample_fraction: 0.25
    event_action_weight: 0.0
  p5_validation_cases: 2
  p6:
    episodes_per_task: 1
    updates_per_episode: 1
    batch_size: 32
    event_sample_fraction: 0.25
    event_action_weight: 0.0
