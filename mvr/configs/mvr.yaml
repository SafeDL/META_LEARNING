schema: transferable_scenario_miner
seed: 11
taskbook: mvr/configs/taskbook.json
model:
  state_dim: 11
  latent_dim: 16
  num_experts: 4
context:
  type: pearl_product
  kl_weight: 0.001
  support_shots: [1, 2, 4]
training:
  device: cuda
  family_filter: all
  step_budget: 240
  learning_rate: 0.0003
evaluation:
  total_episode_budget: 20
  support_shots: [0, 1, 2, 4]
  seeds: [11, 22, 33]
  deterministic: false
  query_cases: 8
  paired_bootstrap_samples: 10000
  paired_bootstrap_seed: 11
calibration_casebook:
  cases_per_task: 24
  candidate_pool_multiplier: 4
  calibration_sut_split: validation
  logical_split: test
  geometry_split: train
reachability:
  cases_per_task: 4
failure:
  severity_thresholds: {ttc_s: 5.0, distance_m: 10.0, closing_speed_mps: 20.0}
  severity_bins: 5
interaction_prior:
  algorithm: adversarial_sac
  action_dim: 2
  batch_size: 64
  episodes_per_task: 5
  updates_per_episode: 8
  replay_capacity: 100000
  learning_rate: 0.0003
  event_action_weight: 0.0
control:
  action_schema: vehicle_residual_2d
  nominal_controller_schema: metadrive_lane_stable_idm
  scenario_contract_schema: scenario_contract
context_meta:
  support_shots: [1, 2, 4]
  groups_per_task: 2
  queries_per_group: 2
  updates_per_episode: 8
  replay_capacity: 100000
  batch_size: 64
  learning_rate: 0.0003
outer:
  algorithm: hybrid_moe_ppo
  router_balance_weight: 0.01
  ppo_epochs: 4
  batch_size: 64
  episodes_per_task: 20
  learning_rate: 0.0003
map:
  encoder: hptr_style
  polyline_points: 16
  embedding_dim: 128
  cache_embeddings_only_when_frozen: true
