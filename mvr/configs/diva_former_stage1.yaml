schema: diva_former_stage1_v1
base_config: mvr/configs/diva_cutin.yaml
source_observations: results/diva/cutin_g01/source_observations_v2.jsonl
source_loso_reference: results/diva/cutin_g01/source_loso_g1_v2.json
results_dir: results/diva_former/cutin_g01/stage1

model:
  d_model: 128
  context_layers: 4
  cross_attention_layers: 2
  num_heads: 4
  ffn_dim: 256
  dropout: 0.10
  candidate_embedding_dim: 16
  max_context: 20
  max_parameters: 3000000

teacher:
  total_budget: 20
  rank: 2
  gp_fit_steps: 100
  continuation_policies: [mine_now, diagnose1_then_mine, diagnose2_then_mine]
  states_per_training_sut: 2000
  context_sizes: [0, 1, 2, 4, 8, 12]
  remaining_budgets: [1, 2, 4, 8, 12]

pretraining:
  synthetic_tasks_per_fold: 10000
  batch_size: 64
  max_steps: 30000
  learning_rate: 0.0003
  weight_decay: 0.0001

utility_distillation:
  batch_size: 32
  max_steps: 20000
  learning_rate: 0.0001
  lambda_formal_q: 1.0
  lambda_vulnerability_q: 0.25
  lambda_rank: 1.0

evaluation:
  network_seeds: [2601, 2602, 2603]
  total_budget: 20
  ndcg_k: 8
