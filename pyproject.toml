[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/cache/pytest"
addopts = "--basetemp=artifacts/cache/pytest-work"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts"]
cache-dir = "artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
