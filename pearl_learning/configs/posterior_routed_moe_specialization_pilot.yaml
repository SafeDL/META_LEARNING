extends: posterior_routed_moe.yaml

project:
  output_root: results/pearl_learning/posterior_routed_moe_mechanism/specialization_pilot/runs

networks:
  moe:
    num_experts: 4
    top_k: 2
    routing: top_k
    input_mode: static_posterior_mean_logvar
    load_balance_weight: 0.001

meta_training:
  bootstrap_episodes_per_task: 1
  gradient_updates_per_iteration: 5
  validation_interval_steps: 1000000

sac:
  batch_size: 128

evaluation:
  shots:
  - 0
  - 1
  - 2
  - 4
  query_cases_per_task: 4
  context_protocol: fixed_nested_v1

specialization_pilot:
  schema: posterior_routed_moe_specialization_pilot_v1
  training_seed: 41
  environment_steps_per_variant: 10000
  train_task_count: 10
  validation_task_count: 4
  query_cases_per_task: 4
  input_modes:
  - static
  - posterior_mean
  - static_posterior_mean
  - static_posterior_mean_logvar
  load_balance_weights:
  - 0.0
  - 0.001
  scope: validation_only_router_signal_diagnostic_not_formal_mechanism_validation
