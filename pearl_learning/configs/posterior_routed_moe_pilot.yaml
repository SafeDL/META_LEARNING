extends: posterior_routed_moe.yaml

project:
  output_root: results/pearl_learning/posterior_routed_moe_mechanism/pilot/runs

networks:
  moe:
    input_mode: static_posterior_mean_logvar

meta_training:
  bootstrap_episodes_per_task: 1
  gradient_updates_per_iteration: 5
  validation_interval_steps: 1000000

sac:
  batch_size: 128

evaluation:
  shots:
  - 0
  - 1
  - 2
  - 4
  query_cases_per_task: 4
  context_protocol: fixed_nested_v1

experiment:
  run_kind: routed_moe_mechanism_pilot

routed_moe_pilot:
  schema: posterior_routed_moe_mechanism_pilot_v1
  training_seed: 41
  environment_steps_per_method: 10000
  train_task_count: 10
  validation_task_count: 2
  query_cases_per_task: 4
  methods:
  - sac
  - moe_sac
  - pearl
  - pearl_moe
  route_interventions:
  - full
  - frozen_router
  - frozen_latent
  - both_frozen
  - uniform
  - knockout_0
  - knockout_1
  pass_criteria:
    require_all_methods_train_and_evaluate: true
    require_finite_metrics: true
    require_parameter_invariance: true
    require_matched_support_across_interventions: true
    require_posterior_dependent_route_change: true
    require_nonzero_expert_action_difference: true
    require_no_expert_collapse: true
  scope: pilot_code_and_mechanism_sanity_not_formal_validation
