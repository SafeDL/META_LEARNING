# Default hyperparameters

env:
  num_scenarios: 20          # map variations per topology family
  horizon: 500               # max steps per episode
  obs_dim: 38
  act_dim: 2                 # [acceleration, steering]
  n_npc_obs: 4               # number of nearest NPCs in observation

# Topology families
topology:
  train: [highway, merge, t_junction, intersection]
  test: [roundabout, y_junction]

# Adversarial reward
reward:
  ttc_scale: 5.0             # clip TTC to this value
  collision_bonus: 3.0
  action_reg: 0.01

# Shared encoder g_phi
encoder:
  hidden: 256
  layers: 2                  # [38 -> 256 -> 256]
  activation: tanh

# FOMAML meta-training
fomaml:
  inner_lr: 0.01
  outer_lr: 0.001
  inner_steps: 3
  meta_batch: 8
  total_env_steps: 200000
  rollout_batch: 64

# PPO (inner loop + adaptation)
ppo:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  vf_coef: 0.5
  n_steps: 2048
  n_epochs: 10
  batch_size: 64
  max_grad_norm: 0.5
  total_timesteps: 50000      # adaptation budget (matches adapt.total_steps)

# SAC adaptation
sac:
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  buffer_size: 100000
  batch_size: 256
  learning_starts: 1000
  train_freq: 1
  gradient_steps: 1
  total_timesteps: 50000

# TD3 adaptation
td3:
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  buffer_size: 100000
  batch_size: 256
  learning_starts: 1000
  train_freq: 1
  exploration_noise: 0.1       # std of Gaussian noise added during rollout
  total_timesteps: 50000

# Adaptation runs
adapt:
  total_steps: 50000           # canonical budget; per-algo total_timesteps must match
  log_interval: 2000           # log every N steps
  n_trajectories_log: 20       # number of trajectories to classify per interval

# Maneuver classifier thresholds (pre-registered, flat keys for ManeuverClassifier)
maneuver:
  cut_in_lat_vel:    0.5     # min |rel_vy| to be a cut-in candidate (m/s)
  cut_in_dist:      20.0     # max NPC distance for cut-in detection (m)
  cut_in_lat_pos:    3.5     # max |rel_y| (≈1 lane width) for cut-in (m)
  tailgate_dist:     8.0     # max longitudinal distance for tailgate (m)
  tailgate_speed:    2.0     # min ego speed for tailgate to be meaningful (m/s)
  tailgate_rel_vx:  -2.0     # NPC relative vx threshold (closing speed, m/s)
  sideswipe_lat_dist: 1.5    # max lateral distance for sideswipe (m)
  sideswipe_lon_dist: 5.0    # max longitudinal distance for sideswipe (m)
  sideswipe_lat_vel:  0.3    # min |rel_vy| toward ego for sideswipe (m/s)
  block_front_dist:  15.0    # max dist for NPC to be considered "in front" (m)
  block_decel:       -2.0    # rel_vx below this = NPC decelerating sharply (m/s)
