schema: fbrt_interaction_catalogue_v1
canonical_units: SI
physics_hz: 20
samples_per_preset: 64
sampling:
  anchor_like_count: 4
  space_filling_count: 12
  target_outcome_filtering: false
scenarios:
  - id: IA
    template_id: fbrt_interaction_front_rear
    parameterization_version: interaction_v1
    interaction_family: front_brake_rear_window
    actor_roles: [ego, lead, rear, adjacent_front]
    research_bounds:
      front_clearance_m: [12, 60]
      front_closing_speed_mps: [0, 5]
      rear_clearance_m: [10, 70]
      rear_closing_speed_mps: [0, 8]
      adjacent_front_clearance_m: [20, 80]
      rear_event_offset_s: [-1, 1]
    fixed_context:
      ego_speed_mps: 25
      front_event_start_s: 3
      lead_deceleration_mps2: 3
      lead_speed_floor_mps: 20
      rear_target_speed_increment_mps: 2
      rear_max_acceleration_mps2: 1.5
      rear_max_speed_mps: 35
      adjacent_front_speed_mps: 27
      lane_count: 2
      duration_s: 12
    required_capability: [autonomous_lane_change]
  - id: IB
    template_id: fbrt_interaction_cutin_escape
    parameterization_version: interaction_v1
    interaction_family: cutin_brake_escape_window
    actor_roles: [ego, lead, rear, adjacent_front]
    research_bounds:
      initial_front_clearance_m: [12, 60]
      front_closing_speed_mps: [0, 5]
      lane_change_time_scale_s: [1.5, 3.0]
      brake_after_measured_merge_s: [0, 1.2]
      rear_clearance_m: [10, 70]
      rear_closing_speed_mps: [0, 8]
    fixed_context:
      ego_speed_mps: 25
      event_start_s: 1
      lead_deceleration_mps2: 3
      lead_speed_floor_mps: 20
      brake_duration_s: 2
      adjacent_front_clearance_m: 80
      adjacent_front_speed_mps: 27
      lane_count: 2
      duration_s: 12
    required_capability: [autonomous_lane_change]
