# Development revision fixed from v1 event chronology, before v2 target runs.
# All candidates and all five builds are retained; no outcome-based filtering.
schema: fbrt_interaction_catalogue_v2
canonical_units: SI
physics_hz: 20
samples_per_preset: 64
sampling:
  anchor_like_count: 4
  space_filling_count: 60
  target_outcome_filtering: false
scenarios:
  - id: IA
    template_id: fbrt_interaction_front_rear
    parameterization_version: interaction_v2
    context_id: IA:interaction_v2:fixed_before_execution
    interaction_family: front_brake_rear_window
    actor_roles: [ego, lead, rear, adjacent_front]
    research_bounds:
      front_clearance_m: [25, 60]
      front_closing_speed_mps: [0, 2]
      rear_clearance_m: [25, 70]
      rear_closing_speed_mps: [2, 8]
      adjacent_front_clearance_m: [40, 80]
      rear_event_offset_s: [-0.5, 0.5]
    fixed_context:
      ego_speed_mps: 25
      front_event_start_s: 3
      lead_deceleration_mps2: 3
      lead_speed_floor_mps: 20
      rear_target_speed_increment_mps: 2
      rear_max_acceleration_mps2: 1.5
      rear_max_speed_mps: 35
      adjacent_front_speed_mps: 27
      lane_count: 2
      duration_s: 12
    required_capability: [autonomous_lane_change]
  - id: IB
    template_id: fbrt_interaction_cutin_escape
    parameterization_version: interaction_v2
    context_id: IB:interaction_v2:fixed_before_execution
    interaction_family: cutin_brake_escape_window
    actor_roles: [ego, lead, rear, adjacent_front]
    research_bounds:
      initial_front_clearance_m: [25, 60]
      front_closing_speed_mps: [0, 3]
      lane_change_time_scale_s: [1.5, 3.0]
      brake_after_measured_merge_s: [0, 0.6]
      rear_clearance_m: [25, 70]
      rear_closing_speed_mps: [2, 8]
    fixed_context:
      ego_speed_mps: 25
      event_start_s: 1
      lead_deceleration_mps2: 3
      lead_speed_floor_mps: 20
      brake_duration_s: 2
      adjacent_front_clearance_m: 80
      adjacent_front_speed_mps: 27
      lane_count: 2
      duration_s: 12
    required_capability: [autonomous_lane_change]
